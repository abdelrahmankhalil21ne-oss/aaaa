<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safehold – secure transactions (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Schibsted Grotesk"','system-ui','sans-serif']},
colors:{navy:{DEFAULT:'#12284C',700:'#1B3866',50:'#E8ECF3'},teal:{DEFAULT:'#0B7F82',700:'#09666A',100:'#D5EEEE',50:'#EAF6F6'},sand:{DEFAULT:'#F4EFE7',200:'#E8E0D3',300:'#D6CBB9'},ink:'#1D2433',mute:'#5A6376'}}}}
</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#F4EFE7;color:#1D2433;font-family:"Schibsted Grotesk",system-ui,sans-serif}
:focus-visible{outline:3px solid #0B7F82;outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes sh-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef,useMemo}=React;
const html=htm.bind(React.createElement);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
const cx=(...a)=>a.filter(Boolean).join(' ');

/* ---------- demo data ---------- */
const TX=[
{id:'SH-2041',title:'2019 Toyota Hilux, 62,000 km',type:'Vehicle',status:'Awaiting Funding',amount:18500,buyer:'Omar Nasser',seller:'Delta Motors',date:'Nov 20, 2026',tl:[['Terms agreed','Nov 20',1],['Buyer funds transaction','Pending',0],['Inspection period','—',0],['Funds released','—',0]]},
{id:'SH-2038',title:'Brand identity and website build',type:'Services',status:'In Progress',amount:6400,buyer:'Lina Haddad',seller:'Studio Kasra',date:'Nov 12, 2026',tl:[['Terms agreed','Nov 12',1],['Buyer funds transaction','Nov 13',1],['Milestone 2 review','Due Nov 30',0],['Funds released','—',0]]},
{id:'SH-2033',title:'Vintage Omega Seamaster watch',type:'High-value goods',status:'In Progress',amount:4200,buyer:'Daniel Park',seller:'Meridian Watches',date:'Nov 8, 2026',tl:[['Terms agreed','Nov 8',1],['Buyer funds transaction','Nov 9',1],['Item delivered and inspected','Due Nov 28',0],['Funds released','—',0]]},
{id:'SH-2027',title:'Commercial espresso machine',type:'High-value goods',status:'Completed',amount:7900,buyer:'Café Almond',seller:'Brewline Supply',date:'Oct 29, 2026',tl:[['Terms agreed','Oct 29',1],['Buyer funds transaction','Oct 30',1],['Item delivered and inspected','Nov 4',1],['Funds released','Nov 5',1]]},
{id:'SH-2019',title:'Translation of 120-page manual',type:'Services',status:'Completed',amount:2300,buyer:'Nile Robotics',seller:'Samira Fahmy',date:'Oct 14, 2026',tl:[['Terms agreed','Oct 14',1],['Buyer funds transaction','Oct 14',1],['Delivery approved','Oct 22',1],['Funds released','Oct 23',1]]},
{id:'SH-2012',title:'2017 Honda CR-V, certified inspection',type:'Vehicle',status:'Completed',amount:15800,buyer:'Hana Mostafa',seller:'Private seller',date:'Sep 30, 2026',tl:[['Terms agreed','Sep 30',1],['Buyer funds transaction','Oct 1',1],['Inspection period','Oct 6',1],['Funds released','Oct 7',1]]}];
const STATUS={'Awaiting Funding':'bg-amber-100 text-amber-900 border-amber-300','In Progress':'bg-teal-100 text-teal-700 border-teal/30','Completed':'bg-navy-50 text-navy border-navy/20','Under Review':'bg-navy text-white border-navy','Release Rejected':'bg-red-100 text-red-900 border-red-300','Temporarily Rejected':'bg-orange-100 text-orange-900 border-orange-300'};
const E=(role,note,time)=>({id:'e'+Math.random().toString(36).slice(2),role,note,url:null,name:'demo',time});
const full=t=>[E('Seller','Item before shipping',t),E('Courier','Package at pickup',t),E('Buyer','Item on arrival',t)];
TX.forEach(t=>{t.evidence=t.status==='Completed'?full(t.date):[];t.reason=null;t.decision=null});
const T=id=>TX.find(x=>x.id===id);
TX.forEach(t=>{t.mine=['SH-2041','SH-2038','SH-2033','SH-2027'].includes(t.id);t.courier=t.type==='Services'?'':'Swift Couriers'});
T('SH-2033').status='Temporarily Rejected';T('SH-2033').evidence=full('Nov 25, 4:05 PM');
T('SH-2038').evidence=[E('Seller','Milestone 1 deliverables','Nov 13, 9:30 AM')];
const TERMS={'Vehicle':['Vehicle matches the listing: year, mileage, and photos','Title and registration papers are handed over','No undisclosed accident damage or mechanical faults','Delivered on the agreed date'],'Services':['Work matches the agreed scope and brief','Files and source materials are delivered in full','Delivered by the agreed deadline','Revisions within the agreed rounds are completed'],'High-value goods':['Item matches the description, model, and serial number','Item is authentic and in the stated condition','Original box, papers, and accessories are included as listed','Packaging arrived sealed and undamaged']};
TX.forEach(t=>{const st=t.status==='Completed'||t.status==='Under Review'?'met':'pending';t.terms=TERMS[t.type].map((text,i)=>({id:'t'+i,text,status:st,note:''}))});
const w=T('SH-2033');w.terms=w.terms.map((x,i)=>({...x,status:i===0?'violated':'met',note:i===0?'Serial number on the case back does not match the listing':''}));w.reason='Funds are on hold until a specialist inspects. The buyer reported terms not met: “'+w.terms[0].text+'” ('+w.terms[0].note+').';w.decision={type:'Auto-held',time:'Nov 25, 2026'};

/* ---------- shared bits ---------- */
const Btn=({v='primary',className='',...p})=>html`<button ...${p} className=${cx('inline-flex items-center justify-center rounded-lg px-5 py-3 text-base font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed',
 v==='primary'&&'bg-teal text-white hover:bg-teal-700',v==='dark'&&'bg-navy text-white hover:bg-navy-700',v==='ghost'&&'border border-navy/25 text-navy hover:bg-white',className)}/>`;
const Badge=({s})=>html`<span className=${cx('inline-block rounded-full border px-2.5 py-0.5 text-xs font-semibold',STATUS[s])}>${s}</span>`;
const DemoBanner=()=>html`<div className="bg-navy text-white text-sm text-center px-4 py-2" role="note">Safehold is a design prototype. Transactions, people, and amounts shown are demo content. No money moves.</div>`;
const Wordmark=()=>html`<span className="flex items-center gap-2 text-navy text-xl font-extrabold tracking-tight"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="#12284C"/><path d="M8 13.5h10M13 8v10" stroke="#5FD0D0" stroke-width="2.4" stroke-linecap="round"/></svg>Safehold</span>`;

function Nav({page,go}){
 const [open,setOpen]=useState(false);
 const link=(label,to,hash)=>html`<a href=${'#'+(hash||to)} onClick=${e=>{e.preventDefault();go(to,hash);setOpen(false)}} className="block py-2 md:py-0 font-medium text-ink hover:text-teal">${label}</a>`;
 return html`<header className="sticky top-0 z-30 bg-sand/95 backdrop-blur border-b border-sand-200">
  <nav aria-label="Main" className="mx-auto max-w-6xl px-5 h-16 flex items-center justify-between">
   <a href="#home" onClick=${e=>{e.preventDefault();go('home')}} aria-label="Safehold home"><${Wordmark}/></a>
   <div className="hidden md:flex items-center gap-8">${link('How it works','home','how')}${link('My transactions','mine')}${link('Dashboard','dashboard')}
    <${Btn} v="ghost" className="!py-2" onClick=${()=>go('signin')}>Sign in<//></div>
   <button className="md:hidden rounded-lg border border-navy/25 px-3 py-2 text-navy font-semibold" aria-expanded=${open} aria-controls="mnav" onClick=${()=>setOpen(!open)}>${open?'Close':'Menu'}</button>
  </nav>
  ${open&&html`<div id="mnav" className="md:hidden border-t border-sand-200 px-5 pb-4 bg-sand">${link('How it works','home','how')}${link('My transactions','mine')}${link('Dashboard','dashboard')}${link('Sign in','signin')}</div>`}
 </header>`;
}

function Footer({go}){
 const L=({t,n})=>html`<li><a href="#help" onClick=${e=>{e.preventDefault();alert(t+' is a demo link. This prototype has no '+t.toLowerCase()+' page.')}} className="text-white/80 hover:text-white underline-offset-4 hover:underline">${t}</a></li>`;
 return html`<footer className="bg-navy text-white mt-24"><div className="mx-auto max-w-6xl px-5 py-12 grid gap-8 md:grid-cols-3">
  <div><span className="text-2xl font-extrabold">Safehold</span><p className="mt-3 text-white/75 max-w-xs">A concept for holding funds neutrally while two parties finish a deal. Demo only.</p></div>
  <nav aria-label="Footer"><ul className="space-y-2"><${L} t="Help center"/><${L} t="Terms"/><${L} t="Privacy"/><${L} t="Contact"/></ul></nav>
  <p className="text-sm text-white/65">Safehold is a front-end prototype. It is not a licensed escrow, bank, or payment provider, and it processes no real transactions.</p></div></footer>`;
}

/* ---------- home ---------- */
function Home({go}){
 const steps=[['Agree on terms','The buyer, seller, and courier confirm the price, a checklist of terms, and who is involved before anything moves.'],['Fund the transaction','The buyer deposits the agreed amount. It stays held while the seller ships and the courier delivers.'],['Release funds when approved','The seller, courier, and buyer each upload photos. When the buyer confirms every term is met, funds release automatically. If a term is violated, funds stay held until a specialist inspects.']];
 return html`<main>
  <section className="mx-auto max-w-3xl px-5 pt-20 pb-20">
   <h1 className="text-4xl sm:text-5xl lg:text-[3.4rem] leading-[1.08] font-extrabold text-navy tracking-tight">Pay when the deal is done, not before.</h1>
   <p className="mt-6 text-lg text-mute max-w-xl leading-relaxed">Safehold sets a buyer’s payment aside while the seller delivers. Everyone involved sees the same terms and the same status until the deal is settled.</p>
   <div className="mt-8 flex flex-wrap gap-3"><${Btn} onClick=${()=>go('create')}>Start a transaction<//><${Btn} v="ghost" onClick=${()=>go('home','how')}>See how it works<//></div>
   <p className="mt-4 text-sm text-mute">Prototype only. Nothing you enter here is sent anywhere.</p></section>
  <section id="how" className="border-y border-sand-200 bg-white py-16"><div className="mx-auto max-w-6xl px-5">
   <h2 className="text-3xl font-extrabold text-navy">How it works</h2>
   <ol className="mt-8 grid gap-6 md:grid-cols-3">${steps.map(([t,d],i)=>html`<li key=${t} className="rounded-xl border border-sand-200 bg-sand/50 p-6"><span className="flex h-9 w-9 items-center justify-center rounded-full bg-navy text-white font-bold" aria-hidden="true">${i+1}</span><h3 className="mt-4 text-xl font-bold text-navy">${t}</h3><p className="mt-2 text-mute leading-relaxed">${d}</p></li>`)}</ol></div></section>
 </main>`;
}

/* ---------- create transaction ---------- */
const STEPS=['Type','Details','Parties','Amount','Terms','Evidence','Review'];
const TYPES=[['Vehicle','Cars, motorcycles, boats'],['Services','Freelance and project work'],['High-value goods','Watches, equipment, art']];
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function validate(step,d){const e={};
 if(step===0&&!d.type)e.type='Choose what you are buying or selling.';
 if(step===1){if(d.title.trim().length<3)e.title='Give the item or service a name of at least 3 characters.';if(d.desc.trim().length<15)e.desc='Describe what is being delivered in at least 15 characters.';}
 if(step===2){if(!d.buyerName.trim())e.buyerName='Enter the buyer’s full name.';if(!emailOk(d.buyerEmail))e.buyerEmail='Enter a valid email, like name@example.com.';if(!d.sellerName.trim())e.sellerName='Enter the seller’s full name.';if(!emailOk(d.sellerEmail))e.sellerEmail='Enter a valid email, like name@example.com.';else if(d.sellerEmail===d.buyerEmail)e.sellerEmail='Buyer and seller need different email addresses.';if(d.type!=='Services'){if(!d.courierName.trim())e.courierName='Enter the courier’s name or company.';if(!emailOk(d.courierEmail))e.courierEmail='Enter a valid email, like name@example.com.';}}
 if(step===3){const a=Number(d.amount);if(!d.amount||isNaN(a)||a<=0)e.amount='Enter an amount greater than zero.';else if(a>1000000)e.amount='Demo amounts are limited to $1,000,000.';}
 if(step===4){if(!d.days)e.days='Choose an inspection window.';if(!d.agree)e.agree='Confirm that you understand this is a demo.';}
 if(step===5&&!d.evAck)e.evAck='Confirm that every party will upload the required photos.';
 return e;}
const Field=({id,label,hint,error,children})=>html`<div><label htmlFor=${id} className="block font-semibold text-navy">${label}</label>${hint&&html`<p id=${id+'-h'} className="text-sm text-mute">${hint}</p>`}<div className="mt-1.5">${children}</div>${error&&html`<p id=${id+'-e'} role="alert" className="mt-1.5 text-sm font-medium text-red-700">${error}</p>`}</div>`;
const inputCls=err=>cx('w-full rounded-lg border bg-white px-3.5 py-3 text-base',err?'border-red-600':'border-sand-300');

function Create({go,onCreate}){
 const [step,setStep]=useState(0);const [errs,setErrs]=useState({});const [done,setDone]=useState(false);const [busy,setBusy]=useState(false);
 const [d,setD]=useState({type:'',title:'',desc:'',buyerName:'',buyerEmail:'',sellerName:'',sellerEmail:'',courierName:'',courierEmail:'',amount:'',days:'',notes:'',agree:false,evAck:false});
 const head=useRef(null);
 useEffect(()=>{head.current&&head.current.focus()},[step,done]);
 const set=k=>e=>setD({...d,[k]:e.target.type==='checkbox'?e.target.checked:e.target.value});
 const inp=(k,label,o={})=>html`<${Field} id=${k} label=${label} hint=${o.hint} error=${errs[k]}>${o.area?html`<textarea id=${k} rows="4" value=${d[k]} onChange=${set(k)} aria-invalid=${!!errs[k]} aria-describedby=${errs[k]?k+'-e':undefined} className=${inputCls(errs[k])}></textarea>`:html`<input id=${k} type=${o.type||'text'} inputMode=${o.mode} value=${d[k]} onChange=${set(k)} aria-invalid=${!!errs[k]} aria-describedby=${errs[k]?k+'-e':undefined} className=${inputCls(errs[k])} autoComplete="off"/>`}<//>`;
 const next=()=>{const e=validate(step,d);setErrs(e);if(!Object.keys(e).length)setStep(step+1)};
 const submit=()=>{setBusy(true);setTimeout(()=>{setBusy(false);onCreate({id:'SH-'+(2100+Math.floor(Math.random()*900)),title:d.title.trim(),type:d.type,status:'Awaiting Funding',amount:Number(d.amount),buyer:d.buyerName.trim(),seller:d.sellerName.trim(),courier:d.type==='Services'?'':d.courierName.trim(),date:'Nov 26, 2026',mine:true,reason:null,decision:null,evidence:[],terms:TERMS[d.type].map((text,i)=>({id:'t'+i,text,status:'pending',note:''})),tl:[['Terms agreed','Nov 26',1],['Buyer funds transaction','Pending',0],['Evidence photos uploaded','Pending',0],['Terms checked and funds released','—',0]]});setDone(true)},900)};
 const fee=Math.max(25,Number(d.amount||0)*0.015);

 if(done)return html`<main className="mx-auto max-w-2xl px-5 py-16"><div className="rounded-2xl border border-sand-300 bg-white p-8">
  <h1 ref=${head} tabIndex="-1" className="text-3xl font-extrabold text-navy">Demo transaction added to My transactions</h1>
  <p className="mt-4 text-mute leading-relaxed">This is a demo. No real transaction was created, nobody was emailed, and no funds were requested. The sample lives only in this browser tab and disappears when you reload.</p>
  <dl className="mt-6 grid grid-cols-2 gap-4 rounded-lg bg-sand/60 p-4 text-sm"><div><dt className="text-mute">Item</dt><dd className="font-semibold">${d.title}</dd></div><div><dt className="text-mute">Amount (demo)</dt><dd className="font-semibold">${money(d.amount)}</dd></div></dl>
  <div className="mt-8 flex flex-wrap gap-3"><${Btn} onClick=${()=>go('mine')}>Track it in My transactions<//><${Btn} v="ghost" onClick=${()=>{setDone(false);setStep(0);setD({type:'',title:'',desc:'',buyerName:'',buyerEmail:'',sellerName:'',sellerEmail:'',courierName:'',courierEmail:'',amount:'',days:'',notes:'',agree:false,evAck:false})}}>Start over<//></div></div></main>`;

 return html`<main className="mx-auto max-w-2xl px-5 py-10">
  <p className="text-sm font-semibold text-teal-700">Demo flow · nothing is submitted</p>
  <h1 ref=${head} tabIndex="-1" className="mt-1 text-3xl font-extrabold text-navy">Start a transaction</h1>
  <ol className="mt-6 flex gap-1.5" aria-label="Progress">${STEPS.map((s,i)=>html`<li key=${s} className="flex-1" aria-current=${i===step?'step':undefined}><div className=${cx('h-1.5 rounded-full',i<=step?'bg-teal':'bg-sand-300')}></div><span className=${cx('mt-1.5 block text-xs sm:text-sm',i===step?'font-bold text-navy':'text-mute')}><span className="sr-only">Step ${i+1}: </span>${s}</span></li>`)}</ol>
  <div className="mt-8 rounded-2xl border border-sand-300 bg-white p-6 sm:p-8 space-y-6">
   ${step===0&&html`<fieldset><legend className="font-semibold text-navy">What is this transaction for?</legend><div className="mt-3 grid gap-3">${TYPES.map(([t,s])=>html`<label key=${t} className=${cx('flex cursor-pointer items-center gap-3 rounded-lg border p-4 has-[:focus-visible]:outline has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-teal',d.type===t?'border-teal bg-teal-50':'border-sand-300')}><input type="radio" name="type" className="h-4 w-4 accent-teal" checked=${d.type===t} onChange=${()=>setD({...d,type:t})}/><span><span className="block font-semibold text-navy">${t}</span><span className="text-sm text-mute">${s}</span></span></label>`)}</div>${errs.type&&html`<p role="alert" className="mt-2 text-sm font-medium text-red-700">${errs.type}</p>`}</fieldset>`}
   ${step===1&&html`<${React.Fragment}>${inp('title','Item or service name',{hint:'For example: 2019 Toyota Hilux'})}${inp('desc','What is being delivered?',{area:1,hint:'Condition, specifications, deliverables, or anything that defines “done.”'})}<//>`}
   ${step===2&&html`<div className="grid gap-6 sm:grid-cols-2">${inp('buyerName','Buyer name')}${inp('buyerEmail','Buyer email',{type:'email'})}${inp('sellerName','Seller name')}${inp('sellerEmail','Seller email',{type:'email'})}${d.type!=='Services'&&html`<${React.Fragment}>${inp('courierName','Courier name or company')}${inp('courierEmail','Courier email',{type:'email'})}<//>`}</div>`}
   ${step===3&&html`<${React.Fragment}>${inp('amount','Amount in USD',{mode:'decimal',hint:'Demo figure. No payment is collected.'})}<p className="rounded-lg bg-sand/60 p-4 text-sm">Estimated demo fee: <strong>${money(fee)}</strong> (illustrative 1.5%, $25 minimum). Real pricing would be shown before you commit.</p><//>`}
   ${step===4&&html`<${React.Fragment}><div className="rounded-lg border border-sand-300 bg-sand/50 p-4"><h2 className="font-semibold text-navy">Standard terms for ${d.type}</h2><ul className="mt-2 list-disc space-y-1 pl-5 text-sm">${TERMS[d.type].map(x=>html`<li key=${x}>${x}</li>`)}</ul><p className="mt-2 text-xs text-mute">The buyer checks each term on delivery. Funds release automatically when every term is met. If any term is violated, funds are held until a specialist inspects.</p></div><${Field} id="days" label="Inspection window" hint="How long the buyer has to approve or raise an issue after delivery." error=${errs.days}><select id="days" value=${d.days} onChange=${set('days')} className=${inputCls(errs.days)}><option value="">Choose a window</option>${[1,3,5,7,14].map(n=>html`<option key=${n} value=${n}>${n} day${n>1?'s':''}</option>`)}</select><//>${inp('notes','Additional terms (optional)',{area:1})}
    <div><label className="flex gap-3 items-start"><input type="checkbox" checked=${d.agree} onChange=${set('agree')} className="mt-1 h-5 w-5 accent-teal"/><span>I understand this is a demo and no real transaction will be created.</span></label>${errs.agree&&html`<p role="alert" className="mt-1.5 text-sm font-medium text-red-700">${errs.agree}</p>`}</div><//>`}
   ${step===5&&html`<div className="space-y-4"><h2 className="text-xl font-bold text-navy">Required evidence photos</h2><p className="text-sm text-mute">After the transaction starts, photos are uploaded in this order. Funds cannot be released automatically until every party has uploaded theirs.</p><ol className="space-y-3">${evRoles(d.type).map(([r,h],i)=>html`<li key=${r} className="flex gap-3 rounded-lg border border-sand-300 p-4"><span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-navy text-sm font-bold text-white" aria-hidden="true">${i+1}</span><span><strong className="text-navy">${r} uploads</strong><span className="block text-sm text-mute">${h}</span></span></li>`)}</ol><div><label className="flex items-start gap-3"><input type="checkbox" checked=${d.evAck} onChange=${set('evAck')} className="mt-1 h-5 w-5 accent-teal"/><span>I understand every party must upload these photos.</span></label>${errs.evAck&&html`<p role="alert" className="mt-1.5 text-sm font-medium text-red-700">${errs.evAck}</p>`}</div></div>`}
   ${step===6&&html`<div><h2 className="text-xl font-bold text-navy">Review your terms</h2><dl className="mt-4 divide-y divide-sand-200 text-sm">${[['Type',d.type],['Item or service',d.title],['Description',d.desc],['Buyer',d.buyerName+' · '+d.buyerEmail],['Seller',d.sellerName+' · '+d.sellerEmail],...(d.type!=='Services'?[['Courier',d.courierName+' · '+d.courierEmail]]:[]),['Amount (demo)',money(d.amount)],['Inspection window',d.days+' day(s)'],['Extra terms',d.notes||'None']].map(([k,v])=>html`<div key=${k} className="grid grid-cols-3 gap-3 py-3"><dt className="text-mute">${k}</dt><dd className="col-span-2 font-medium break-words">${v}</dd></div>`)}</dl></div>`}
   <div className="flex justify-between gap-3 pt-2">${step>0?html`<${Btn} v="ghost" onClick=${()=>{setErrs({});setStep(step-1)}}>Back<//>`:html`<span></span>`}
    ${step<6?html`<${Btn} onClick=${next}>Continue<//>`:html`<${Btn} onClick=${submit} disabled=${busy}>${busy?'Submitting demo…':'Submit demo'}<//>`}</div>
  </div></main>`;
}

/* ---------- sign in ---------- */
function SignIn({go,user,setUser}){
 const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [show,setShow]=useState(false);const [e,setE]=useState({});const [busy,setBusy]=useState(false);
 const submit=ev=>{ev.preventDefault();const n={};if(!emailOk(email))n.email='Enter a valid email, like name@example.com.';if(pw.length<8)n.pw='Use at least 8 characters.';setE(n);if(Object.keys(n).length)return;
  setBusy(true);setTimeout(()=>{setBusy(false);if(pw==='wrong'){setE({form:'Demo error state: this password was rejected. Try any other 8+ character password.'})}else{setUser(email);}},800)};

/* ---------- photo evidence ---------- */

function Evidence({tx,onAdd,readOnly}){

 const pick=e=>{const files=[...e.target.files];e.target.value='';setErr('');setOk('');if(!files.length)return;
  const bad=files.find(f=>!f.type.startsWith('image/'));if(bad){setErr(bad.name+' is not an image. Choose JPG, PNG, or WebP photos.');return}
  const big=files.find(f=>f.size>5*1024*1024);if(big){setErr(big.name+' is larger than 5 MB. Choose a smaller photo.');return}
  const time=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  onAdd(tx.id,files.map(f=>({id:'e'+Math.random().toString(36).slice(2),role,note:note.trim(),url:URL.createObjectURL(f),name:f.name,time})));setNote('');setOk(files.length+' photo(s) added as '+role+'.')};
 return html`<div className="mt-3 space-y-5"><ol className="space-y-1 text-sm">${evRoles(tx.type).map(([r])=>{const dn=tx.evidence.some(e=>e.role===r);return html`<li key=${r} className=${dn?'font-semibold text-teal-700':'text-mute'}>${dn?'Done':'Required'}: ${r} photos</li>`})}</ol><${Gallery} tx=${tx}/>

  <${Field} id="ev-note" label="Note (optional)"><input id="ev-note" value=${note} onChange=${e=>setNote(e.target.value)} placeholder="What does this show?" className=${inputCls()}/><//></div>
  <${Field} id="ev-file" label="Photos" hint="JPG, PNG, or WebP, up to 5 MB each. Photos stay in your browser. Nothing is uploaded." error=${err}><input id="ev-file" type="file" accept="image/*" multiple onChange=${pick} className="block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-navy file:px-4 file:py-2.5 file:font-semibold file:text-white"/><//>
  <p role="status" className="text-sm font-medium text-teal-700">${ok}</p></div>`}</div>`;
}

 const [selId,setSelId]=useState(null);const [rejecting,setRejecting]=useState(false);const [reason,setReason]=useState('');const [rerr,setRerr]=useState('');const [msg,setMsg]=useState('');
 const [f,setF]=useState('All');const queue=items.filter(t=>f==='All'||t.status===f);const sel=items.find(t=>t.id===selId);const canAct=t=>t.status==='Temporarily Rejected';const decided=items.filter(t=>t.decision);

  setItems(items.map(x=>x.id===t.id?{...x,status:'Release Rejected',reason:reason.trim(),decision:{type:'Rejected after inspection',time:'Nov 26, 2026'}}:x));setMsg(t.id+' rejected. Your reason is now visible to the buyer and seller.');setReason('');setRerr('');setRejecting(false);setSelId(null)};
 if(!ok)return html`<main className="mx-auto max-w-md px-5 py-16"><form onSubmit=${enter} noValidate className="space-y-5 rounded-2xl border border-sand-300 bg-white p-8"><div><h1 className="text-2xl font-extrabold text-navy">Developer dashboard</h1><p className="mt-1 text-sm text-mute">Developer access only. Review every transaction, then accept or reject funds that are on hold.</p></div>

  <div className="mt-6 grid gap-6 lg:grid-cols-3">

    ${queue.length===0?html`<p className="mt-3 rounded-xl border border-dashed border-sand-300 bg-white p-6 text-sm text-mute">No transactions match this filter.</p>`:html`<ul className="mt-3 space-y-3">${queue.map(t=>html`<li key=${t.id}><button onClick=${()=>pickTx(t.id)} aria-pressed=${selId===t.id} className=${cx('w-full cursor-pointer rounded-xl border bg-white p-4 text-left',selId===t.id?'border-teal':'border-sand-300 hover:border-teal')}><span className="text-xs text-mute">${t.id}</span><span className="block font-semibold text-navy">${t.title}</span><span className="mt-1 flex items-center justify-between gap-2"><span className="text-sm text-mute">${money(t.amount)}</span><${Badge} s=${t.status}/></span></button></li>`)}</ul>`}</section>
   <section aria-labelledby="dh" className="lg:col-span-2"><h2 id="dh" className="font-bold text-navy">Decision</h2>

     ${canAct(sel)&&miss.length>0&&html`<p className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-900">Release is blocked until photos are on file from: ${miss.join(', ')}. You can still reject with a reason.</p>`}

  <div className="mt-6" aria-live="polite">
  ${load?html`<div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3" role="status"><span className="sr-only">Loading demo transactions</span>${[1,2,3].map(i=>html`<div key=${i} className="h-40 rounded-xl border border-sand-300 bg-white animate-pulse"></div>`)}</div>`
  :fail?html`<div role="alert" className="rounded-xl border border-red-300 bg-red-50 p-6"><p className="font-semibold text-red-800">Demo transactions did not load.</p><${Btn} v="dark" className="mt-3" onClick=${loadIt}>Try again<//></div>`
  :items.length===0?html`<div className="rounded-xl border border-dashed border-sand-300 bg-white p-10 text-center"><h2 className="text-xl font-bold text-navy">No transactions yet</h2><p className="mt-1 text-mute">Start a transaction and you can track it here.</p><${Btn} className="mt-4" onClick=${()=>go('create')}>Start a transaction<//></div>`:list.length===0?html`<div className="rounded-xl border border-dashed border-sand-300 bg-white p-10 text-center"><h2 className="text-xl font-bold text-navy">No transactions match</h2><p className="mt-1 text-mute">Clear the search or choose a different status.</p><${Btn} v="ghost" className="mt-4" onClick=${()=>{setQ('');setF('All')}}>Clear filters<//></div>`
  :html`<ul className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">${list.map(t=>html`<li key=${t.id}><button onClick=${()=>setSel(t.id)} className="h-full w-full cursor-pointer rounded-xl border border-sand-300 bg-white p-5 text-left shadow-sm hover:border-teal hover:shadow-md"><div className="flex items-center justify-between gap-2"><span className="text-xs text-mute">${t.id} · Demo</span><${Badge} s=${t.status}/></div><span className="mt-3 block font-bold text-navy">${t.title}</span><span className="mt-1 block text-sm text-mute">${t.buyer} → ${t.seller}</span><span className="mt-4 block text-2xl font-extrabold text-navy">${money(t.amount)}</span><span className="mt-3 block text-sm font-semibold text-teal-700">View details, terms, and photos</span></button></li>`)}</ul>`}
  </div>
  ${cur&&html`<${Modal} tx=${cur} onClose=${()=>setSel(null)} onRequest=${submitTerms} onEvidence=${addEv} onTerms=${setTerm} onRecheck=${recheck} onFund=${fund}/>`}</main>`;
}

/* ---------- app ---------- */
const PAGES=['home','create','signin','mine','dashboard'];
function App(){
 const init=()=>{const h=location.hash.slice(1);return PAGES.includes(h)?h:'home'};
 const [page,setPage]=useState(init);const [user,setUser]=useState(null);const [items,setItems]=useState(TX);
 const go=(p,anchor)=>{setPage(p);try{history.replaceState(null,'','#'+(anchor||p))}catch(e){}
  setTimeout(()=>{if(anchor){const el=document.getElementById(anchor);el&&el.scrollIntoView({behavior:'smooth'})}else window.scrollTo(0,0)},30)};
 useEffect(()=>{document.title='Safehold – '+({home:'secure transactions',create:'start a transaction',signin:'sign in',mine:'my transactions',dashboard:'developer dashboard'})[page]+' (demo)'},[page]);
 useEffect(()=>{const h=()=>{const x=location.hash.slice(1);if(PAGES.includes(x))setPage(x)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);
 return html`<${React.Fragment}><${DemoBanner}/><${Nav} page=${page} go=${go}/>
  ${page==='home'&&html`<${Home} go=${go}/>`}${page==='create'&&html`<${Create} go=${go} onCreate=${tx=>setItems(p=>[tx,...p])}/>`}${page==='signin'&&html`<${SignIn} go=${go} user=${user} setUser=${setUser}/>`}${page==='mine'&&html`<${Dashboard} go=${go} items=${items.filter(t=>t.mine)} setItems=${setItems}/>`}${page==='dashboard'&&html`<${Staff} go=${go} items=${items} setItems=${setItems}/>`}
  <${Footer} go=${go}/><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
